<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">RasterPilot – Vom Bild zum druckfertigen Halbtonraster</title>
  <desc id="desc">Dunkelblaues Banner mit RasterPilot-Schriftzug, türkisfarbenen Rasterpunkten und stilisiertem Papierflieger.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#1b3b51"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="5" fill="#55e0ce"/></pattern>
    <linearGradient id="fade"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="dots-fade"><rect x="720" width="480" height="320" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x="720" width="480" height="320" fill="url(#dots)" mask="url(#dots-fade)" opacity=".34"/>
